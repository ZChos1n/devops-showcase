apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showcase-api
spec:
  podSelector:
    matchLabels:
      app: showcase-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller and monitoring scraper may reach the app.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32  # block cloud metadata endpoint (SSRF hardening)
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
