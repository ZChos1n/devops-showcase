apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: showcase-api
  app.kubernetes.io/part-of: devops-showcase

images:
  - name: showcase-api
    newName: ghcr.io/your-org/showcase-api
    newTag: dev
