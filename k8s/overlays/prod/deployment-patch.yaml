apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: SERVICE_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
