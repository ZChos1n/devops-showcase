route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical
      matchers:
        - severity="critical"

receivers:
  - name: default
  - name: critical
    # In production, wire this to Slack/PagerDuty/Feishu via a webhook.
    # Kept empty here so the demo never sends real notifications.

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname"]
