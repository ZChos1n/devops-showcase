global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker-compose demo: scrape the app directly.
  - job_name: showcase-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: showcase-api

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
